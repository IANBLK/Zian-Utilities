name: Bootstrap Gradle Wrapper

on:
  push:
    branches:
      - feature/m1-core-bootstrap
    paths:
      - '.github/workflows/bootstrap-wrapper.yml'
  workflow_dispatch:

jobs:
  wrapper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.2.1 --distribution-type bin
      - name: Upload wrapper files
        uses: actions/upload-artifact@v6
        with:
          name: gradle-wrapper-9.2.1
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
