name: Bootstrap Gradle Wrapper

on:
  push:
    branches:
      - feature/m1-core-bootstrap
    paths:
      - '.github/workflows/bootstrap-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      - name: Generate Gradle 9.2.1 wrapper
        run: gradle wrapper --gradle-version 9.2.1 --distribution-type bin

      - name: Commit wrapper to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Wrapper already up to date."
            exit 0
          fi
          git commit -m "build: add Gradle 9.2.1 wrapper"
          git push origin HEAD:main
