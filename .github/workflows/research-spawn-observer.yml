name: Research Spawn Observer

on:
  push:
    branches:
      - research/runtime-spawn-observer
    paths:
      - 'research/runtime-spawn-observer/**'
      - '.github/workflows/research-spawn-observer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/runtime-spawn-observer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile observer
        run: gradle --no-daemon compileJava

      - name: Build observer
        run: gradle --no-daemon build

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: zian-runtime-spawn-observer
          path: research/runtime-spawn-observer/build/libs/*.jar
          if-no-files-found: error
